name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 프로젝트가 아닌(아직 package.json 없는) 경우는 전체 단계 스킵
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Print versions
        if: steps.detect.outputs.present == 'true'
        run: |
          node -v
          npm -v

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.detect.outputs.present == 'true' && hashFiles('**/.eslintrc*') != ''
        run: npm run lint --if-present

      - name: Type check
        if: steps.detect.outputs.present == 'true' && hashFiles('**/tsconfig.json') != ''
        run: npm run type-check --if-present || npx tsc -noEmit

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present
